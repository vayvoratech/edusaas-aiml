services:
  # ---------------------------------------------------------------------------
  # SERVICE 1: Unified AI, Proctoring, Plagiarism, Quiz & ML Analytics Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: aiml-unified-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard # 2GB RAM accommodates MediaPipe, OpenCV, YOLO, and TF-IDF
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MODEL_VERSION
        value: "1.0.0"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: XLNET_MODEL_PATH
        value: "/app/models/xlnet_answer_assessment_model.pt"
      - key: DATABASE_URL
        sync: false # Set via Render dashboard or use fromDatabase if managed on Render

  # ---------------------------------------------------------------------------
  # SERVICE 2: Sandboxed Multi-Compiler Code Execution Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: assignment-execution-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./assignment-execution-service
    plan: standard
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production