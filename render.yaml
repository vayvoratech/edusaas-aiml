services:
  # ---------------------------------------------------------------------------
  # SERVICE 1: Unified AI, Proctoring, Plagiarism & Quiz Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aiml-unified-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard # Standard plan recommended for MediaPipe, OpenCV, and YOLO memory load
    region: oregon # Options: oregon, frankfurt, ohio, singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"

  # ---------------------------------------------------------------------------
  # SERVICE 2: Sandboxed Multi-Compiler Code Execution Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: assignment-execution-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./assignment-execution-service
    plan: starter # Starter plan recommended for multi-language in-memory compilation
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production