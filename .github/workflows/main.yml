name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VAYVORA: ${{ secrets.VAYVORA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Flake8
        run: pip install flake8

      - name: Static Code Analysis
        run: flake8 .

      - name: Unit Tests
        run: pytest

      - name: Build Check
        run: python -m compileall .
