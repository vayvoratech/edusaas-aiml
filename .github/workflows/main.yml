name: EduSaaS AIML CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Trigger Pipeline
      - name: Trigger Pipeline
        run: echo "Pipeline triggered successfully"

      # Step 2: Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 3: Dependency Installation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependency Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Static Code Analysis - Pylint
      - name: Static Code Analysis - Pylint
        run: |
          pip install pylint
          pylint . --disable=C0114,C0115,C0116

      # Step 5: Compile / Build
      - name: Compile / Build
        run: |
          python -m compileall .

      # Step 6: Unit Testing
      - name: Unit Testing
        run: |
          pip install pytest
          pytest

      # Step 7: Security & Vulnerability Scan
      - name: Security & Vulnerability Scan
        run: |
          pip install pip-audit
          pip-audit
