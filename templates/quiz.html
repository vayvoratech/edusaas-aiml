<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSaaS Skill Assessment</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="{{ url_for('static', filename='js/quiz.js') }}"
            defer></script>
</head>

<body>

<div class="container">

    <div class="quiz-card">

        <!-- Header -->
        <div class="header">

            <h2>EduSaaS Skill Assessment</h2>

            <h3 id="skill-name">
                {{ skill_name }}
            </h3>

            <p class="question-count">
                Question
                <span id="question-number">
                    {{ question_number }}
                </span>
            </p>

        </div>

        <hr>

        <!-- Question -->

        <div class="question">

            <h3 id="question-text">
                {{ question.question_text }}
            </h3>

        </div>

        <!-- Quiz Form -->

        <form id="quizForm">

            <input
                type="hidden"
                id="question-id"
                value="{{ question.question_id }}">

            <label class="option">
                <input type="radio" name="answer" value="A">
                <span id="option-a">
                    {{ question.option_a }}
                </span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="B">
                <span id="option-b">
                    {{ question.option_b }}
                </span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="C">
                <span id="option-c">
                    {{ question.option_c }}
                </span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="D">
                <span id="option-d">
                    {{ question.option_d }}
                </span>
            </label>

            <button
                type="submit"
                class="btn">
                Next
            </button>

        </form>

    </div>

</div>

</body>
</html>
