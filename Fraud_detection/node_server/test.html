```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduSaaS AI Proctoring Test</title>

    <style>

        body {
            margin: 0;
            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        video {
            width: 640px;
            height: 480px;

            background: black;

            border-radius: 10px;
        }

        #status {
            margin-top: 20px;

            font-size: 20px;

            font-weight: bold;
        }

        #result {

            width: 640px;

            margin: 20px auto;

            padding: 20px;

            background: white;

            border-radius: 10px;

            text-align: left;

            box-sizing: border-box;

            font-family: Consolas, monospace;

            white-space: pre-wrap;

            min-height: 250px;
        }

    </style>

</head>


<body>

    <h1>
        EduSaaS AI Proctoring Test
    </h1>


    <!-- =========================================
         STUDENT CAMERA
         ========================================= -->

    <video
        id="studentVideo"
        autoplay
        muted
        playsinline>
    </video>


    <!-- =========================================
         CONNECTION STATUS
         ========================================= -->

    <div id="status">
        Connecting...
    </div>


    <!-- =========================================
         AI RESULT
         ========================================= -->

    <div id="result">
        Waiting for AI result...
    </div>


<script>


// =====================================================
// ELEMENTS
// =====================================================

const video =
    document.getElementById(
        "studentVideo"
    );


const status =
    document.getElementById(
        "status"
    );


const resultBox =
    document.getElementById(
        "result"
    );


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.createElement(
        "canvas"
    );


canvas.width = 640;

canvas.height = 480;


const context =
    canvas.getContext(
        "2d"
    );


// =====================================================
// CAMERA
// =====================================================

let cameraStream = null;


async function startCamera() {

    try {

        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        width: 640,
                        height: 480
                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        await video.play();


        console.log(
            "Camera started"
        );


    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        status.innerText =
            "Camera permission denied";


        resultBox.innerText =
            "Unable to access camera.\n\n" +
            error.message;
    }
}


// =====================================================
// WEBSOCKET
// =====================================================

const socket =
    new WebSocket(
        "ws://127.0.0.1:3000"
    );


// =====================================================
// WEBSOCKET OPEN
// =====================================================

socket.onopen = async function () {

    console.log(
        "Connected to Node.js"
    );


    status.innerText =
        "Connected to AI Proctoring";


    // -----------------------------------------------
    // Tell Python that examination started
    // -----------------------------------------------

    socket.send(
        JSON.stringify({

            type:
                "START_EXAM"

        })
    );


    // -----------------------------------------------
    // Start camera
    // -----------------------------------------------

    await startCamera();


    // -----------------------------------------------
    // Start sending frames
    // -----------------------------------------------

    startFrameSending();

};


// =====================================================
// RECEIVE MESSAGE
// =====================================================

socket.onmessage = async function (event) {

    try {

        let messageText;


        // =============================================
        // BLOB
        // =============================================

        if (
            event.data instanceof Blob
        ) {

            messageText =
                await event.data.text();
        }


        // =============================================
        // STRING
        // =============================================

        else if (
            typeof event.data ===
            "string"
        ) {

            messageText =
                event.data;
        }


        // =============================================
        // ARRAY BUFFER
        // =============================================

        else if (
            event.data instanceof
            ArrayBuffer
        ) {

            const decoder =
                new TextDecoder(
                    "utf-8"
                );


            messageText =
                decoder.decode(
                    event.data
                );
        }


        // =============================================
        // UNKNOWN
        // =============================================

        else {

            console.warn(
                "Unknown WebSocket data:",
                event.data
            );

            return;
        }


        console.log(
            "Python -> Browser:",
            messageText
        );


        // =============================================
        // PARSE JSON
        // =============================================

        const data =
            JSON.parse(
                messageText
            );


        // =============================================
        // PROCTORING STARTED
        // =============================================

        if (
            data.type ===
            "PROCTORING_STARTED"
        ) {

            status.innerText =
                "AI Proctoring Active";


            resultBox.innerText =
                "AI Proctoring connected.\n\n" +
                "Waiting for first analysis...";


            return;
        }


        // =============================================
        // PROCTORING RESULT
        // =============================================

        if (
            data.type ===
            "PROCTORING_RESULT"
        ) {

            status.innerText =
                "AI Proctoring Active";


            // -----------------------------------------
            // Extract results
            // -----------------------------------------

            const face =
                data.face || {};


            const eye =
                data.eye_tracking || {};


            const phone =
                data.phone || {};


            const fraud =
                data.fraud || {};


            const blink =
                data.blink;


            const headPose =
                data.head_pose;


            const mouth =
                data.mouth;


            // -----------------------------------------
            // Phone
            // -----------------------------------------

            const phoneStatus =
                phone.detected
                    ? "DETECTED"
                    : "NOT DETECTED";


            // -----------------------------------------
            // Display
            // -----------------------------------------

            resultBox.innerText =

                "========================================\n" +
                "       EDU SAAS AI PROCTORING\n" +
                "========================================\n\n" +

                "Frame Number   : " +
                (
                    data.frame_number ??
                    "-"
                ) +

                "\n\n" +

                "FACE\n" +
                "----------------------------------------\n" +

                "Status         : " +
                (
                    face.status ??
                    "-"
                ) +

                "\n" +

                "Face Count     : " +
                (
                    face.face_count ??
                    0
                ) +

                "\n\n" +

                "EYE TRACKING\n" +
                "----------------------------------------\n" +

                "Direction      : " +
                (
                    eye.direction ??
                    "-"
                ) +

                "\n\n" +

                "BLINK\n" +
                "----------------------------------------\n" +

                "Status         : " +
                (
                    blink ??
                    "-"
                ) +

                "\n\n" +

                "HEAD POSE\n" +
                "----------------------------------------\n" +

                JSON.stringify(
                    headPose,
                    null,
                    2
                ) +

                "\n\n" +

                "MOUTH\n" +
                "----------------------------------------\n" +

                JSON.stringify(
                    mouth,
                    null,
                    2
                ) +

                "\n\n" +

                "PHONE\n" +
                "----------------------------------------\n" +

                "Status         : " +
                phoneStatus +

                "\n" +

                "Count          : " +
                (
                    phone.count ??
                    0
                ) +

                "\n" +

                "Confidence     : " +
                (
                    phone.confidence ??
                    0
                ) +

                "\n" +

                "Inference      : " +
                (
                    phone.inference_ms ??
                    0
                ) +
                " ms\n\n" +

                "FRAUD ENGINE\n" +
                "----------------------------------------\n" +

                "Action         : " +
                (
                    fraud.action ??
                    "NORMAL"
                ) +

                "\n" +

                "Severity       : " +
                (
                    fraud.severity ??
                    "LOW"
                ) +

                "\n" +

                "Phone Evidence: " +
                (
                    fraud.phone_detections ??
                    0
                );


            return;
        }


        // =============================================
        // PROCTORING ERROR
        // =============================================

        if (
            data.type ===
            "PROCTORING_ERROR"
        ) {

            status.innerText =
                "AI Proctoring Error";


            resultBox.innerText =
                data.message ||
                "Unknown proctoring error";


            return;
        }


        // =============================================
        // PROCTORING STOPPED
        // =============================================

        if (
            data.type ===
            "PROCTORING_STOPPED"
        ) {

            status.innerText =
                "Proctoring stopped";


            resultBox.innerText =
                "Examination proctoring stopped.";


            return;
        }


        // =============================================
        // OTHER MESSAGE
        // =============================================

        resultBox.innerText =
            JSON.stringify(
                data,
                null,
                2
            );

    }

    catch (error) {

        console.error(
            "WebSocket message error:",
            error
        );


        resultBox.innerText =
            "Unable to process AI result.\n\n" +
            error.message;
    }

};


// =====================================================
// WEBSOCKET ERROR
// =====================================================

socket.onerror = function (error) {

    console.error(
        "WebSocket error:",
        error
    );


    status.innerText =
        "WebSocket Error";


    resultBox.innerText =
        "Unable to connect to " +
        "the proctoring server.";
};


// =====================================================
// WEBSOCKET CLOSED
// =====================================================

socket.onclose = function (event) {

    console.log(
        "WebSocket closed:",
        event.code,
        event.reason
    );


    status.innerText =
        "Proctoring disconnected";
};


// =====================================================
// SEND CAMERA FRAMES
// =====================================================

function startFrameSending() {

    console.log(
        "Starting frame transmission..."
    );


    setInterval(
        sendFrame,
        200
    );
}


// =====================================================
// SEND ONE FRAME
// =====================================================

function sendFrame() {

    // -----------------------------------------------
    // WebSocket ready?
    // -----------------------------------------------

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;
    }


    // -----------------------------------------------
    // Camera ready?
    // -----------------------------------------------

    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        return;
    }


    // -----------------------------------------------
    // Draw video to canvas
    // -----------------------------------------------

    context.drawImage(

        video,

        0,
        0,

        640,
        480
    );


    // -----------------------------------------------
    // Convert to JPEG
    // -----------------------------------------------

    const frame =
        canvas.toDataURL(
            "image/jpeg",
            0.5
        );


    // -----------------------------------------------
    // Send frame
    // -----------------------------------------------

    socket.send(
        JSON.stringify({

            type:
                "VIDEO_FRAME",

            timestamp:
                Date.now(),

            frame:
                frame

        })
    );
}


// =====================================================
// INITIAL MESSAGE
// =====================================================

console.log(
    "EduSaaS Proctoring Test Started"
);


</script>

</body>

</html>
```
